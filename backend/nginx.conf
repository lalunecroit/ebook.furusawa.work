# API の前段。静的ファイルはここが返し、PHP は php-fpm (backend:9000) に渡す。
server {
    listen       80;
    server_name  localhost;
    server_tokens off;

    # 公開ディレクトリは Laravel の public/ だけ。
    # app/ や .env はドキュメントルートの外にあるため配信されない。
    root   /app/public;
    index  index.php;

    # 開発中は bind mount 経由でファイルを差し替えるため sendfile を切る
    # (理由は frontend/nginx.conf と同じ)
    sendfile off;

    charset utf-8;

    # アップロードの上限。内側 (php.d/zz-app.ini の post_max_size) より上に取る。
    # 段の全体は php.d/zz-app.ini のコメントを参照
    client_max_body_size 16m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   backend:9000;
        fastcgi_index  index.php;
        include        fastcgi_params;
        # php-fpm 側から見たスクリプトの絶対パス。
        # backend コンテナと同じ /app にマウントしているので一致する
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $document_root;
        fastcgi_read_timeout 60s;
    }

    # .env や .git などドットで始まるものは配信しない
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
