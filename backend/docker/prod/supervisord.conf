; nginx と php-fpm を1コンテナで動かすための設定。
; Cloud Run は1コンテナしか起動できないので、この2つを supervisord が束ねる。
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
; 落ちたら再起動せず、下の eventlistener にコンテナごと終わらせる
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; どちらか一方が終了したら supervisord ごと落とす。
;
; これが無いと「php-fpm だけ死んで nginx は生きている」状態になり、
; コンテナは起動中に見えるのに全リクエストが 502 を返し続ける。
; コンテナごと終了させれば Cloud Run が新しいインスタンスを作り直す。
[eventlistener:quit_on_failure]
command=/usr/local/bin/stop-supervisor.sh
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
