; 本番用の php-fpm プール設定。
; ファイル名が zz-prod なのは、ベースイメージの zz-docker.conf より後に
; 読ませて listen を上書きするため (php-fpm.d/*.conf は辞書順に読まれる)。
[www]
; Cloud Run が渡す環境変数 (DB_*, APP_KEY など) をワーカーに通す。
; 既定の clear_env = yes だとアプリ側に届かない。
clear_env = no

; nginx は同じコンテナの中にいるので、外に晒す必要がない
listen = 127.0.0.1:9000

; ワーカーの stdout/stderr をコンテナのログに乗せる
catch_workers_output = yes
decorate_workers_output = no

; php-fpm 自身のアクセスログは nginx と二重になるので出さない
access.log = /dev/null

; Cloud Run は1インスタンスあたりの同時実行数が既定 80。
; メモリ量に合わせて静的に確保し、リクエスト処理中の fork を避ける。
; インスタンスのメモリを増やしたらここも見直す。
pm = static
pm.max_children = 8
pm.max_requests = 500
