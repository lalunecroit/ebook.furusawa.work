; 本番用の PHP 設定 (開発用イメージには入れない)。

; ソースはイメージに焼き込まれていて実行中に変わらないので、
; opcache のタイムスタンプ検証を切って stat を丸ごと無くす。
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; バージョンを X-Powered-By で晒さない
expose_php=Off

; Cloud Run のリクエストサイズ上限 32MiB より内側に揃える (step07 の 17)
upload_max_filesize=30M
post_max_size=30M
memory_limit=256M

; ログはファイルではなくコンテナの標準エラーへ (Cloud Logging が拾う)
log_errors=On
error_log=/dev/stderr
display_errors=Off
