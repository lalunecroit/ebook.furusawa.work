; 本番用の PHP 設定 (開発用イメージには入れない)。

; ソースはイメージに焼き込まれていて実行中に変わらないので、
; opcache のタイムスタンプ検証を切って stat を丸ごと無くす。
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; バージョンを X-Powered-By で晒さない
expose_php=Off

; アップロードの上限は複数の層にあり、外側ほど大きくないと内側まで届かない。
; 内側で止まらないと、アプリが用意した日本語のエラーではなく
; PHP や nginx の汎用エラーがそのまま出てしまう (step07 の 17)。
;
;   Laravel のバリデーション  8MB   BookPageUploadRequest::MAX_KB (利用者に見える上限)
;   upload_max_filesize      10M   ここが 8MB 未満だと PHP がファイルを捨て、
;                                  「画像 failed to upload.」になる
;   post_max_size            12M   ファイル本体 + フォーム項目 + マルチパート境界
;   client_max_body_size     16m   nginx (docker/prod/nginx.conf.template)
;   Cloud Run の上限         32MiB これは変えられない。上のすべてが下回っていること
;
; 開発側の同じ設定は php.d/zz-app.ini にある。値を変えるときは両方そろえる。
upload_max_filesize=10M
post_max_size=12M
memory_limit=256M

; ログはファイルではなくコンテナの標準エラーへ (Cloud Logging が拾う)
log_errors=On
error_log=/dev/stderr
display_errors=Off
