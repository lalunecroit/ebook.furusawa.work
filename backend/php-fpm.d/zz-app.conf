[www]
; compose の environment を PHP 側へ通す。
; php-fpm の既定は clear_env = yes で、環境変数をすべて捨ててから
; ワーカーを起動するため、DB_HOST などがアプリに届かなくなる。
clear_env = no

; 開発用。bind mount したソースを書き換えたときに即反映させたいので、
; opcache のタイムスタンプ検証は php.ini 側 (下記) に任せる。
; ここではログを標準エラーに出してコンテナのログに乗せる。
catch_workers_output = yes
decorate_workers_output = no
