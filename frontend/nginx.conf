server {
    listen       80;
    server_name  localhost;

    # 開発中は bind mount 経由でファイルを差し替えるため sendfile を切る。
    # Docker Desktop の仮想 FS と sendfile の組み合わせでは、更新後も
    # 古い内容が配信され続けることがある。
    # (http コンテキストの sendfile on を server 単位で上書きしている)
    sendfile off;

    root   /usr/share/nginx/html;
    index  index.html;

    # SVG/画像は長めにキャッシュ、HTML/JS/CSS は都度確認
    location ~* \.(svg|png|jpg|jpeg|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
