<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1131" width="800" height="1131" role="img" aria-label="表紙画像なし">
  <!-- 表紙が未登録の書籍に使うプレースホルダ。ページ画像と同じ A5 相当 (800x1131) -->
  <rect width="800" height="1131" fill="#2f3339"/>
  <rect x="24" y="24" width="752" height="1083" fill="none" stroke="#454b53" stroke-width="2" stroke-dasharray="10 8" rx="8"/>

  <!-- 画像アイコン (枠 + 山 + 太陽) -->
  <g transform="translate(400 500)">
    <rect x="-120" y="-90" width="240" height="180" rx="10" fill="none" stroke="#6b737d" stroke-width="6"/>
    <circle cx="-55" cy="-35" r="20" fill="#6b737d"/>
    <path d="M-110 70 L-35 -5 L20 50 L60 15 L110 70 Z" fill="#6b737d"/>
  </g>

  <text x="400" y="680" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="52"
        font-weight="600" fill="#8b939d" text-anchor="middle">No Image</text>
  <text x="400" y="736" font-family="'Hiragino Sans','Noto Sans JP',sans-serif" font-size="26"
        fill="#6b737d" text-anchor="middle">表紙は準備中です</text>
</svg>
