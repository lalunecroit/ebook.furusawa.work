<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>書籍一覧 | ebook.furusawa.work</title>
<link rel="stylesheet" href="css/library.css">
</head>
<body>

<!-- ============ ヘッダー ============ -->
<header class="bar">
  <h1 class="bar__title">ebook.furusawa.work</h1>
  <span class="bar__count" id="count"></span>
</header>

<!-- ============ 本体 ============ -->
<!--
  カードは js/library.js が API (/api/books) のレスポンスから組み立てる。
  リンク先は reader.html?book=<code> で、ビューアはこの code で書誌情報を引く。
-->
<main class="library">
  <ul class="grid" id="grid"></ul>

  <!-- 読み込み中 / 0件 / エラーの表示に使い回す -->
  <p class="state" id="state">読み込み中…</p>

  <nav class="pager" id="pager" hidden aria-label="ページ送り">
    <button class="pager__btn" type="button" id="prev">← 前へ</button>
    <span class="pager__status" id="pagerStatus"></span>
    <button class="pager__btn" type="button" id="next">次へ →</button>
  </nav>
</main>

<!-- スクリーンリーダー向けの読み上げ領域 -->
<p class="visually-hidden" id="liveRegion" role="status" aria-live="polite"></p>

<script src="js/config.js"></script>
<script src="js/library.js"></script>
</body>
</html>
