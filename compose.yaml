# ローカル開発用。将来 backend サービスをここに足していく。
services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      # 公開ディレクトリを丸ごと1つだけマウントする。
      # サブディレクトリを個別にマウントすると Docker Desktop 側で
      # マウントが外れ、中身が空に見えることがあるため。
      - ./frontend/public:/usr/share/nginx/html:ro
    restart: unless-stopped

  # ドキュメント閲覧用。docs/ を読むだけなので build せず公式イメージをそのまま使う。
  docs:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      # frontend と同じ構成。公開するのは public/ だけで、nginx.conf はその外に置く
      - ./docs/public:/usr/share/nginx/html:ro
      - ./docs/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ページ画像の配信 (CDN 相当)。書影や本文画像はここから配る。
  cdn:
    image: nginx:1.27-alpine
    ports:
      - "8082:80"
    volumes:
      - ./cdn/public:/usr/share/nginx/html:ro
      - ./cdn/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # API の PHP 実行 (php-fpm)。HTTP は前段の backend-web が受ける。
  # ホストにポートを公開しないので、外から直接は叩けない。
  backend:
    build: ./backend
    volumes:
      # 開発中はソースをそのまま反映させる (vendor もホスト側のものを使う)
      - ./backend:/app
      # 管理画面からページ画像を書き込むため、cdn の公開ディレクトリを渡す。
      # 本番では GCS になるので、この mount は開発用。
      - ./cdn/public:/var/www/cdn
    environment:
      # 画像URLの組み立てに使うベースURL。ブラウザから見えるホスト名で渡す
      CDN_BASE_URL: "http://localhost:8082"
      # API を fetch してよいオリジン。開発では frontend サービス (8080)。
      # 本番は www. と apex を渡す (step07 の 7)
      CORS_ALLOWED_ORIGINS: "http://localhost:8080"
      # 本番 (Cloud Run) に合わせて DB に置く。開発だけ file にすると
      # セッション絡みの不具合がローカルで再現しなくなる (step07 の 13)
      SESSION_DRIVER: "database"
      # 書き込み先 (filesystems.php の cdn ディスク)
      CDN_ROOT: /var/www/cdn
      APP_ENV: local
      APP_DEBUG: "true"
      # 絶対URLの基点。リクエストがある間はリクエスト側が優先されるので、
      # 効くのは artisan など CLI から URL を作るとき (step07 の 8)
      APP_URL: "http://localhost:8000"
      APP_TIMEZONE: Asia/Tokyo
      # 接続先は db サービス。.env より環境変数が優先されるので、
      # .env が sqlite のままでもコンテナ内では MySQL に繋がる
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ebooks_local
      DB_USERNAME: ebooks
      DB_PASSWORD: password
      DB_TIMEZONE: "+09:00"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # API の前段 nginx。静的ファイルを返し、PHP は backend:9000 に渡す。
  backend-web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      # public/ を配信し、SCRIPT_FILENAME のパスを backend 側と揃えるため
      # ソースは同じ /app にマウントする (読み取り専用)
      - ./backend:/app:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # 開発用ツール (CLI)。常駐しないので profiles で通常の up からは外し、
  # docker compose run --rm tools のように都度起動する。
  #   docker compose run --rm tools                        サンプル画像を生成
  #   docker compose run --rm tools php -m | grep gd       拡張の確認
  tools:
    build: ./tools
    profiles: ["tools"]
    volumes:
      # 生成先が cdn/public/... なので、リポジトリごとマウントする
      - .:/work
    working_dir: /work

  # MySQL。ローカル開発用なので認証情報はベタ書きにしている。
  db:
    image: mysql:8.4
    command: --default-time-zone=+09:00
    ports:
      # ホストから artisan migrate や GUI クライアントで直接繋ぐために公開する
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ebooks_local
      MYSQL_USER: ebooks
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      # 名前付きボリュームに永続化する。作り直したいときは
      # docker compose down -v でこのボリュームごと消す。
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # DB 管理画面。db サービス専用の GUI で、アプリからは参照しない。
  phpmyadmin:
    image: phpmyadmin:5.2
    ports:
      - "8083:80"
    environment:
      # 接続先は compose のサービス名で解決する
      PMA_HOST: db
      PMA_PORT: "3306"
      # ローカル専用なので自動ログインにしておく。
      # root で入りたいときはこの2行を消せばログイン画面が出る (root / root)
      PMA_USER: ebooks
      PMA_PASSWORD: password
      # dump の取り込みでサイズ上限に当たらないように少し広げておく
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ 本番 DB
  # 本番の Cloud SQL を手元から覗くときだけ起動する。
  #   docker compose --profile prod-db up -d   → http://localhost:8084
  #
  # Cloud SQL は IP 許可リストを空にしてあるため、素の mysql では繋がらない。
  # 接続できるのは Cloud SQL Auth Proxy 経由だけで、利用には IAM の
  # roles/cloudsql.client が要る (認証をネットワーク層ではなく IAM に寄せている)。
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    profiles: ["prod-db"]
    command:
      - "my-project-book-509215:asia-northeast1:ebook-db"
      # 既定は 127.0.0.1 で、コンテナ内からしか繋げない。
      # phpmyadmin-prod から届くようにする
      - "--address=0.0.0.0"
    volumes:
      # ホストの ADC を読み取り専用で渡す。認証は自分の Google アカウント
      - ~/.config/gcloud/application_default_credentials.json:/adc.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /adc.json
    restart: unless-stopped

  # 本番 DB 用の phpMyAdmin。開発用 (:8083) とは別に立てる。
  phpmyadmin-prod:
    image: phpmyadmin:5.2
    profiles: ["prod-db"]
    ports:
      # 開発用と見分けがつくようにポートをずらす
      - "8084:80"
    environment:
      PMA_HOST: cloudsql-proxy
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
      # PMA_USER / PMA_PASSWORD は意図的に置かない。
      # 自動ログインにすると「開発のつもりで本番を消す」事故が起きる。
      # パスワードを取りに行く一手間が、そのまま確認の手順になる:
      #   gcloud secrets versions access latest --secret=ebook-db-password
    depends_on:
      - cloudsql-proxy
    restart: unless-stopped

volumes:
  db-data:
