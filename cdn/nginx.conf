# 画像配信 (CDN 相当)。配るのはページ画像だけで、動的処理は一切しない。
# 方針: 圧縮できるものは圧縮し、キャッシュは長く持たせる。
server {
    listen       80;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;

    # 差し替え時に古い内容が残らないように (理由は frontend/nginx.conf と同じ)
    sendfile off;

    # 同じファイルを繰り返し配るので、メタ情報をキャッシュして stat を減らす
    open_file_cache          max=1000 inactive=60s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   off;

    # ---------------------------------------------------------------- 圧縮
    # SVG はテキストなので効果が大きい。
    # PNG/JPEG/WebP/AVIF は既に圧縮済みなので gzip しても無駄 (対象に入れない)
    gzip              on;
    gzip_types        image/svg+xml;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_vary         on;

    # 事前に作っておいた .gz があればそれを返す (例: page-01.svg.gz)
    # 実行時の圧縮を省けるので、枚数が増えたときはこちらを使う
    gzip_static on;

    # ------------------------------------------------------------ キャッシュ
    # ファイル名が同じなら中身も同じ、という前提で1年 + immutable。
    # 画像を差し替えるときはファイル名を変えるか ?v= を付けて回す
    location ~* \.(svg|png|jpe?g|webp|avif|gif|ico)$ {
        # expires を併用すると Cache-Control が2行になるので、1行にまとめて出す
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;  # 将来 fetch/canvas で扱う場合に備えて
        access_log off;
        log_not_found off;
    }

    # 本ごとのページを一覧できるようにしておく (開発時の確認用)
    location / {
        autoindex on;
        autoindex_exact_size off;
    }

    # 画像しか置かない場所なので、それ以外の拡張子は配らない
    location ~* \.(php|js|mjs|json|html?|conf|env|sh|py)$ {
        return 404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
