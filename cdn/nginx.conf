# 画像配信 (CDN 相当)。frontend / docs と同じく public/ だけを公開する。
server {
    listen       80;
    server_name  localhost;

    # 差し替え時に古い内容が残らないように (理由は frontend/nginx.conf と同じ)
    sendfile off;

    root   /usr/share/nginx/html;
    charset utf-8;

    # 本ごとのページを一覧できるようにしておく (開発時の確認用)
    autoindex on;
    autoindex_exact_size off;

    # CDN なので画像は長めにキャッシュ。
    # <img> 経由の表示に CORS は不要だが、将来 fetch/canvas で扱う場合に備えて許可しておく
    location ~* \.(svg|png|jpg|jpeg|webp|avif)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types image/svg+xml;
}
