<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドキュメント一覧</title>
<style>
  /* 配色は frontend/public/css/style.css のトークンに合わせている */
  :root {
    --bg: #2a2d31;
    --bg-side: #212428;
    --bg-code: #1b1e21;
    --fg: #e8eaed;
    --muted: #9aa4af;
    --accent: #6ea0ff;
    --border: #3a3f45;
    --sidebar-width: 260px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.8;
  }

  .layout {
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr;
    height: 100dvh;
  }

  /* -------------------------------------------------- サイドバー */
  .side {
    background: var(--bg-side);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 0;
  }

  .side__title {
    margin: 0 20px 16px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .side__group {
    margin: 0 20px 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .side__list { list-style: none; margin: 0 0 24px; padding: 0; }

  .side__link {
    display: block;
    padding: 7px 20px;
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    border-left: 3px solid transparent;
    word-break: break-all;
  }
  .side__link:hover { background: rgba(255, 255, 255, 0.05); }
  .side__link.is-active {
    border-left-color: var(--accent);
    background: rgba(110, 160, 255, 0.12);
    color: var(--accent);
  }

  .side__empty { margin: 0 20px 24px; font-size: 13px; color: var(--muted); }

  /* -------------------------------------------------- 本文 */
  .main { overflow-y: auto; }

  .main__bar {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 32px;
    background: rgba(20, 22, 25, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .main__bar a { color: var(--accent); }
  .main__path { flex: 1; word-break: break-all; }

  .doc { max-width: 860px; padding: 28px 32px 96px; }

  /* Markdown 本文 */
  .doc h1, .doc h2, .doc h3, .doc h4 { line-height: 1.4; margin: 1.8em 0 0.6em; }
  .doc h1 { font-size: 26px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-top: 0.4em; }
  .doc h2 { font-size: 21px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .doc h3 { font-size: 17px; color: var(--accent); }
  .doc p, .doc li { font-size: 15px; }
  .doc a { color: var(--accent); }
  .doc ul, .doc ol { padding-left: 1.4em; }
  .doc li { margin: 0.3em 0; }
  .doc hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }

  .doc blockquote {
    margin: 1em 0;
    padding: 2px 0 2px 16px;
    border-left: 3px solid var(--accent);
    color: var(--muted);
  }

  .doc code {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 13px;
    font-family: "SFMono-Regular", Menlo, Consolas, monospace;
  }

  .doc pre {
    background: var(--bg-code);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    overflow-x: auto;
    line-height: 1.6;
  }
  .doc pre code { background: none; border: none; padding: 0; font-size: 13px; }

  .doc table {
    border-collapse: collapse;
    width: 100%;
    margin: 1.2em 0;
    font-size: 14px;
  }
  .doc th, .doc td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .doc th { background: rgba(255, 255, 255, 0.05); }

  .doc img { max-width: 100%; }

  /* フォールバック時の生テキスト表示 */
  .doc pre.raw { white-space: pre-wrap; word-break: break-word; }

  .notice {
    margin: 0 0 20px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-left: 3px solid #d08a3a;
    border-radius: 4px;
    color: var(--muted);
    font-size: 13px;
  }

  /* アーティファクト(HTML)はそのまま埋め込んで見る */
  .frame {
    width: 100%;
    height: calc(100dvh - 44px);
    border: 0;
    background: #fff;
    display: block;
  }

  /* -------------------------------------------------- 狭い画面 */
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; }
    .side { border-right: none; border-bottom: 1px solid var(--border); }
    .doc { padding: 20px 18px 64px; }
    .main__bar { padding: 10px 18px; }
  }
</style>
</head>
<body>
  <div class="layout">
    <nav class="side">
      <h1 class="side__title">docs</h1>
      <div id="nav"></div>
    </nav>

    <main class="main">
      <div class="main__bar">
        <span class="main__path" id="path">—</span>
        <a id="rawLink" href="#" target="_blank" rel="noopener">ソース</a>
      </div>
      <div class="doc" id="doc">読み込み中…</div>
    </main>
  </div>

<script>
/* ============================================================
   docs ビューア
     - ディレクトリ一覧は nginx の autoindex を取得して組み立てる
       (ファイルを足しても index.html を書き換えなくて済む)
     - .md は marked で HTML 化。CDN が取れなければ生テキスト表示に落とす
     - ここで表示するのは自分のリポジトリ内のファイルだけなので
       サニタイズは行っていない
   ============================================================ */

/** サイドバーに出すディレクトリ。[パス, 見出し] */
const DIRS = [
  ['md/', 'Markdown'],
  ['artifact/', 'Artifact'],
];

const MARKED_SRC = 'https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js';

const el = {
  nav: document.getElementById('nav'),
  doc: document.getElementById('doc'),
  path: document.getElementById('path'),
  rawLink: document.getElementById('rawLink'),
};

/* -------------------------------------------------- ファイル一覧 */

/** autoindex の HTML から、ディレクトリでないファイル名を拾う */
async function listDirByAutoindex(dir) {
  const res = await fetch(dir, { cache: 'no-store' });
  if (!res.ok) throw new Error(`${dir} -> ${res.status}`);
  const html = await res.text();
  const dom = new DOMParser().parseFromString(html, 'text/html');
  return [...dom.querySelectorAll('a')]
    .map((a) => a.getAttribute('href'))
    .filter((href) => href && !href.startsWith('../') && !href.endsWith('/'))
    .map(decodeURIComponent);
}

/**
 * 事前生成されたファイル一覧。DIRS の数だけ取りに行かないよう1回で済ませる。
 * ローカルには置いていないので、ここは毎回 null になる。
 */
let indexPromise = null;
function loadIndex() {
  indexPromise ??= fetch('index.json', { cache: 'no-store' })
    .then((res) => (res.ok ? res.json() : null))
    .catch(() => null);
  return indexPromise;
}

/**
 * index.json があればそれを使い、無ければ autoindex に落とす。
 *
 * autoindex が無い静的ホスティング (GCS など) では index.json を置く。
 * ローカルは逆に index.json を置かないので autoindex が使われ、
 * ファイルを足した瞬間にサイドバーへ出る。
 */
async function listDir(dir) {
  const index = await loadIndex();
  return index?.[dir] ?? listDirByAutoindex(dir);
}

async function buildNav() {
  for (const [dir, label] of DIRS) {
    const group = document.createElement('div');
    group.className = 'side__group';
    group.textContent = label;
    el.nav.append(group);

    let files = [];
    try {
      files = await listDir(dir);
    } catch (e) {
      const msg = document.createElement('p');
      msg.className = 'side__empty';
      msg.textContent = `${dir} を読めませんでした`;
      el.nav.append(msg);
      continue;
    }

    if (files.length === 0) {
      const msg = document.createElement('p');
      msg.className = 'side__empty';
      msg.textContent = 'ファイルなし';
      el.nav.append(msg);
      continue;
    }

    const ul = document.createElement('ul');
    ul.className = 'side__list';
    for (const name of files.sort()) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.className = 'side__link';
      a.href = `#/${dir}${name}`;
      a.textContent = name;
      a.dataset.path = `${dir}${name}`;
      li.append(a);
      ul.append(li);
    }
    el.nav.append(ul);
  }
}

/* -------------------------------------------------- Markdown */

/** marked を1回だけ読み込む。失敗したら null を返す(呼び出し側でフォールバック) */
let markedPromise = null;
function loadMarked() {
  if (markedPromise) return markedPromise;
  markedPromise = new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = MARKED_SRC;
    s.onload = () => resolve(window.marked ?? null);
    s.onerror = () => resolve(null);
    document.head.append(s);
  });
  return markedPromise;
}

async function renderMarkdown(text) {
  const marked = await loadMarked();
  if (!marked) {
    // CDN に届かないとき。読めないよりは生のまま出す
    el.doc.innerHTML = '';
    const notice = document.createElement('p');
    notice.className = 'notice';
    notice.textContent = 'Markdown パーサ (marked) を取得できなかったため、原文をそのまま表示しています。';
    const pre = document.createElement('pre');
    pre.className = 'raw';
    pre.textContent = text;
    el.doc.append(notice, pre);
    return;
  }
  marked.setOptions({ gfm: true, breaks: false });
  el.doc.innerHTML = marked.parse(text);
}

/* -------------------------------------------------- ルーティング */

function setActive(path) {
  for (const a of el.nav.querySelectorAll('.side__link')) {
    a.classList.toggle('is-active', a.dataset.path === path);
  }
}

async function show(path) {
  el.path.textContent = path || '—';
  el.rawLink.href = path || '#';
  setActive(path);

  if (!path) {
    el.doc.innerHTML = '<p>左の一覧からファイルを選んでください。</p>';
    return;
  }

  // .html (artifact) は完成品なので、そのまま埋め込んで見せる
  if (/\.html?$/i.test(path)) {
    el.doc.innerHTML = '';
    const frame = document.createElement('iframe');
    frame.className = 'frame';
    frame.src = path;
    frame.title = path;
    el.doc.style.maxWidth = 'none';
    el.doc.style.padding = '0';
    el.doc.append(frame);
    return;
  }

  el.doc.style.maxWidth = '';
  el.doc.style.padding = '';
  el.doc.textContent = '読み込み中…';

  try {
    const res = await fetch(path, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    await renderMarkdown(await res.text());
    el.doc.scrollIntoView({ block: 'start' });
    document.querySelector('.main').scrollTop = 0;
  } catch (e) {
    el.doc.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'notice';
    p.textContent = `${path} を読み込めませんでした: ${e.message}`;
    el.doc.append(p);
  }
}

/** #/md/step01.md -> md/step01.md */
function currentPath() {
  const hash = location.hash.replace(/^#\/?/, '');
  return decodeURIComponent(hash);
}

window.addEventListener('hashchange', () => show(currentPath()));

(async function init() {
  await buildNav();
  // ハッシュ未指定なら最初の md を開く
  if (!currentPath()) {
    const first = el.nav.querySelector('.side__link[data-path$=".md"]');
    if (first) {
      location.replace(first.getAttribute('href'));
      return;
    }
  }
  show(currentPath());
})();
</script>
</body>
</html>
