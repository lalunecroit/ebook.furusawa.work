# docs/public/ 閲覧用。frontend とは別コンテナ・別ポートで、読み取り専用で配信する。
server {
    listen       80;
    server_name  localhost;

    # 執筆中のファイルを bind mount 経由で差し替えるため sendfile を切る。
    # (理由は frontend.nginx.conf と同じ)
    sendfile off;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # index.html (ビューア) が無い md/ artifact/ 配下はディレクトリ一覧から辿れるようにする
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # .md は mime.types に無く、既定では octet-stream (= ダウンロード) になる。
    # ブラウザでそのまま読めるようテキスト扱いにする。
    location ~* \.md$ {
        default_type text/plain;
    }

    # 執筆中は常に最新を出す
    location / {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
}
